description: The work carrier (orchestrator work_carrier) as an observer. Under this identity and an OBSERVER-only M2M credential (key id work-carrier-observer), it records one observation per standing-approval check before an intake (orchestrator ADR-0055 amendment 22 item 3), and nothing else. Its intakes keep the shared orchestrator-system SYSTEM credential, unchanged. The orchestrator's decomposition gate trusts that observation only when recorded_by is this agent id, so no other caller may hold it. It runs on the operator machine and moves to a container in ADR-0059 increment 4, hence environment any.
