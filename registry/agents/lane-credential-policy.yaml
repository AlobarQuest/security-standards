schema: agent-identity/v1
agent_id: lane-credential-policy
version: 1
status: active
runtime: unknown
operator: devon
environment: any
description: >-
  The approver recorded when a proposer-generated revision 1 of a lane credential (a
  `bws-lane-token` or `healthchecks-ping-url` rotation) is approved by conformance to Devon's
  standing answer of 2026-11-10 (D-34 A; orchestrator ADR-0055 amendment 22). A LABEL, NOT A
  RUNTIME — the same kind of entry as `deploy-policy`. Nothing runs under this identity, no
  credential authenticates as it, and it appears only as the `actor` on that `package.approved`
  event, beside the `policy:<profile>@v<N>` approver its evidence carries (intent-packages ADR-0028's approver
  shape, which no agent id can take). The standing answer's date and entry travel in the event
  detail, never in this string, so the identity stays stable. Reissues (revision 2 and later) are
  never recorded under it; they need Devon by name.
  `runtime: unknown` / `environment: any` mirror `deploy-policy` and `unknown` — the registry's
  established shape for a label — rather than naming where the approving cycle happens to run,
  because nothing executes here and a runtime named for it would be the one false field.
authority_profile: none-v1
capabilities: []
prohibited: []
