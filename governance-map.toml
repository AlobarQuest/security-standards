# governance-map.toml — single source of truth for tool ownership + build-agent alignment.
# Lane rule: security-standards DETECTS, infraops-mcp-server MUTATES, change-manager APPROVES.
#
# Gating scope (be honest — this lane model must not create false confidence):
#   change-manager's APPROVE lane gates the AUTONOMOUS path ONLY — the 4am security-drift
#   executor, which is plan-hash-gated through change-manager before it applies anything.
#   A live INTERACTIVE Claude session is NOT approval-gated: it reaches the infraops mutation
#   tools directly, contained only by guardrails — permissions.deny (catastrophic commands),
#   the high-power-gate hook, and the high-power-actions audit log.
#   In one line: autonomous mutations are APPROVAL-gated; interactive mutations are GUARDRAIL-gated.
#
# Projected into: deploys + control-plane reconcile (make install), ~/.claude/OWNERSHIP.md + source headers (make ownership), verification (make verify).
# Edit here. Each deployed artifact carries a generated "# Source of truth:" header — edit the source, then: cd ~/Projects/security-standards && make install.

# ─────────────────────────── Deployed artifacts ───────────────────────────
[[tool]]
name = "security-scan.sh"
lane = "detect"
home_repo = "security-standards"
source = "scripts/security-scan.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/bin/security-scan.sh"
mode = "755"

[[tool]]
name = "skills-security-scan.sh"
lane = "detect"
home_repo = "security-standards"
source = "scripts/skills-security-scan.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/bin/skills-security-scan.sh"
mode = "755"

[[tool]]
name = "bws-write-guard.sh"
lane = "detect"
home_repo = "security-standards"
source = "hooks/bws-write-guard.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/hooks/bws-write-guard.sh"
mode = "755"

[[tool]]
name = "bws-read-guard.sh"
lane = "detect"
home_repo = "security-standards"
source = "hooks/bws-read-guard.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/hooks/bws-read-guard.sh"
mode = "755"

[[tool]]
name = "bws-scan-gate.sh"
lane = "detect"
home_repo = "security-standards"
source = "hooks/bws-scan-gate.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/hooks/bws-scan-gate.sh"
mode = "755"

# The Stop-gate scan of ~/.claude self-matches the deployed bws-write-guard.sh detection
# regex (a known-safe BLOCK — detecting the token shape IS the hook's job). This allowlist
# exempts that one match so a legit control-plane scan passes. Deployed (not hosted) so the
# source of truth stays in security-standards and survives a ~/.claude reset.
[[tool]]
name = "claude-home-allowlist"
lane = "detect"
home_repo = "security-standards"
source = "deploy/claude-home.security-scan-allow.toml"
artifact_class = "deployed"
deploy_target = "~/.claude/.security-scan-allow.toml"
mode = "644"

[[tool]]
name = "factory-events-nightly.sh"
lane = "detect"
home_repo = "security-standards"
source = "scripts/factory-events-nightly.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/bin/factory-events-nightly.sh"
mode = "755"

# Sourced by factory-events-nightly.sh to report each run to the orchestrator's observation
# spine (ADR-0021). Deployed alongside it because the nightly job runs from ~/.claude/bin and
# resolves this file relative to itself. Best-effort by construction: if it is absent the job
# logs that the run will not be observed and carries on.
[[tool]]
name = "observe-run.sh"
lane = "detect"
home_repo = "security-standards"
source = "scripts/observe-run.sh"
artifact_class = "deployed"
deploy_target = "~/.claude/bin/observe-run.sh"
mode = "755"

# ───────────────────── Control-plane host (version-control home of ~/.claude/) ─────────────────────
# The ~/.claude/ directory is itself a git repo. It is NOT governed by security-standards
# (no detect/mutate/approve lane) — it is the version-control HOME of the global config and
# the work-tree where `make install` (reconcile_control_plane) commits the deployed artifacts.
# Hosted artifacts are authored AND version-tracked here, so they carry no source-of-truth header.
[[repo]]
name = "claude-control-plane"
path = "~/.claude"
class = "host"
remote = "https://github.com/AlobarQuest/claude-control-plane.git"
owns = [
  "~/.claude/CLAUDE.md (global session instructions)",
  "~/.claude/RTK.md",
  "~/.claude/settings.json",
  "version-tracking of all deployed hooks + bin/ (source-of-truth: security-standards)",
]

[[tool]]
name = "CLAUDE.md"
lane = "host"
home_repo = "claude-control-plane"
source = "CLAUDE.md"
artifact_class = "hosted"

[[tool]]
name = "RTK.md"
lane = "host"
home_repo = "claude-control-plane"
source = "RTK.md"
artifact_class = "hosted"

[[tool]]
name = "settings.json"
lane = "host"
home_repo = "claude-control-plane"
source = "settings.json"
artifact_class = "hosted"

# ─────────────────────────────── Repos ────────────────────────────────────
[[repo]]
name = "security-standards"
path = "~/Projects/security-standards"
class = "tool-home"
lane = "detect"
owns = ["security_scan (python package)", "security-scan.sh", "skills-security-scan.sh", "bws-write-guard.sh", "bws-read-guard.sh", "bws-scan-gate.sh"]
consumers = ["security-standards", "infraops-mcp-server", "change-manager"]

[[repo]]
name = "factory-runner"
path = "~/Projects/factory-runner"
class = "tool-home"
lane = "execute"
owns = [
  "factory_runner (python CLI, installed per run)",
  ".github/workflows/factory-runner.yml (the reusable workflow every caller invokes)",
  "RECOMMENDED_CALLER_PIN (the revision callers are expected to pin)",
]
# Consumers pin a full SHA in their own .github/workflows/factory-runner-pilot.yml; the
# caller's `uses:` SHA IS the installed CLI revision (WS-P2.23). So a merge here reaches
# nobody until a consumer deliberately advances its pin -- see the tool-home landing rule.
consumers = ["intent-packages", "orchestrator", "change-manager", "brain", "security-standards", "infraops-mcp-server"]

[[repo]]
name = "infraops-mcp-server"
path = "~/Projects/infraops-mcp-server"
class = "tool-home"
lane = "mutate"
owns = ["infraops MCP server", "drift-audit.sh", "change-window.sh", "security-drift subsystem"]

[[repo]]
name = "change-manager"
path = "~/Projects/change-manager"
class = "tool-home"
lane = "approve"
owns = ["change-manager FastAPI service"]

# Consumer build agents (registered in Task 10). BWS-consuming repos.
[[repo]]
name = "Contacts"
path = "~/Projects/Contacts"
class = "consumer"
uses_bws = true

[[repo]]
name = "FacelessTT"
path = "~/Projects/FacelessTT"
class = "consumer"
uses_bws = true

[[repo]]
name = "imap-mcp-server"
path = "~/Projects/imap-mcp-server"
class = "consumer"
uses_bws = true

[[repo]]
name = "rental-investment-calculator"
path = "~/Projects/rental-investment-calculator"
class = "consumer"
uses_bws = true

[[repo]]
name = "VideoCreator"
path = "~/Projects/VideoCreator"
class = "consumer"
uses_bws = true

[[repo]]
name = "vps-backup"
path = "~/Projects/vps-backup"
class = "consumer"
uses_bws = true

[[repo]]
name = "intent-packages"
path = "~/Projects/intent-packages"
class = "consumer"
uses_bws = true

# ───────────────────── Runtime state (deliberately repo-less) ─────────────────────
[[runtime_dir]]
path = "~/.config/infra-drift"
note = "infra-drift env + security baselines; gitignored; machine-level."

[[runtime_dir]]
path = "~/infra-drift/reports"
note = "daily audit/remediation/security/change-window digests."

[[runtime_dir]]
path = "~/.claude/audit"
note = "weekly detector logs + high-power-action audit log."
