# Secrets this repo consumes, by stable BWS UUID.
# factory_events runtime reads them from ~/.factory/env (chmod 600), which is
# provisioned from these BWS entries — see src/factory_events/README.md.
# Hand-written: genmanifest derives from runtime bws-get code references, and this
# package consumes via env injection instead (same pattern as brain; see the
# scanner consumption-mode backlog item).
consumption = "environment-injection"
# Exception to that mode: scripts/observe-run.sh (the recovery-floor observation poster,
# ADR-0021) calls `bws secret get` directly by UUID, so ORCHESTRATOR_DRIFT_REPORTER_TOKEN
# below IS a runtime code reference rather than an env-injected one.

[[secret]]
uuid = "8998c4ea-453c-4ae1-9b5c-b49500b8dacc"
name = "ORCHESTRATOR_DRIFT_REPORTER_TOKEN"
project = "Ops / Platform"

[[secret]]
uuid = "af0e4192-edc6-46ae-9e4f-b469011dbb8d"
name = "change-manager/M2M_TOKEN"
project = "Ops / Platform"

[[secret]]
uuid = "ea09a782-e22f-4ab9-b381-b47c00adb9ed"
name = "factory-events/POSTGRES_PASSWORD"
project = "Ops / Platform"
