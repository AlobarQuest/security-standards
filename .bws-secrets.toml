# Secrets this repo consumes, by stable BWS UUID.
# Hand-written, and every row is a runtime code reference: the scanner's manifest-drift check
# reports a row no runtime code names, and a runtime UUID no row declares.
# - ORCHESTRATOR_DRIFT_REPORTER_TOKEN: scripts/observe-run.sh (the recovery-floor observation
#   poster, ADR-0021) calls `bws secret get` by UUID.
# - change-manager/M2M_TOKEN: scripts/factory-events-nightly.sh fetches it by UUID on every run.
# - factory-events-append-password: the nightly fetches it by UUID on every run (after reading
#   ~/.factory/chain-db.env) as the `factory-events-nightly` machine account, whose access token
#   it reads from Keychain `Claude` / BWS_ACCESS_TOKEN_FACTORY_EVENTS_NIGHTLY.
consumption = "code-reference"

[[secret]]
uuid = "8998c4ea-453c-4ae1-9b5c-b49500b8dacc"
name = "ORCHESTRATOR_DRIFT_REPORTER_TOKEN"
project = "Rotation / Keepers"

[[secret]]
uuid = "af0e4192-edc6-46ae-9e4f-b469011dbb8d"
name = "change-manager/M2M_TOKEN"
project = "Rotation / Keepers"

[[secret]]
uuid = "2ce0dbc7-eeac-4bf0-8204-b50200c97516"
name = "factory-events-append-password"
project = "Factory Events"
