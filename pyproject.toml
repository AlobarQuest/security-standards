[project]
name = "security-scan"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0.3",
  "psycopg[binary]>=3.3.4",
  "ruff>=0.16.2",
  "pyright==1.1.411",
]
events = ["jsonschema>=4.26.0", "psycopg[binary]>=3.3.4", "pyyaml>=6.0.3"]

[dependency-groups]
# `uv sync` installs the default dev group in the generic Quality workflow.
# Keep the optional `dev` extra above for security-scan.yml's pip install path.
dev = [
  "pytest>=9.1.1",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0.3",
  "psycopg[binary]>=3.3.4",
  "ruff>=0.16.2",
  "pyright==1.1.411",
]

[project.scripts]
security-scan = "security_scan.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: tests requiring external disposable services",
]

[tool.ruff]
line-length = 100
# ruff 0.16 formats Python code blocks inside Markdown; 0.15 did not. The affected
# files here are ADRs and historical plan documents — the record, not code — so the
# formatter is excluded from them rather than allowed to rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingModuleSource = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/alembic", "**/migrations"]
