[project]
name = "security-scan"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
security-scan = "security_scan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
