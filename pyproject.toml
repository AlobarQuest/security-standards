[project]
name = "security-scan"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "ruff==0.15.20",
  "pyright==1.1.411",
]
events = ["jsonschema>=4.21", "psycopg[binary]>=3.1", "pyyaml>=6.0"]

[dependency-groups]
# `uv sync` installs the default dev group in the generic Quality workflow.
# Keep the optional `dev` extra above for security-scan.yml's pip install path.
dev = [
  "pytest>=7.0",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "ruff==0.15.20",
  "pyright==1.1.411",
]

[project.scripts]
security-scan = "security_scan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: tests requiring external disposable services",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingModuleSource = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/alembic", "**/migrations"]
