# Tests that the default gate (quality.yml -> `make check`) cannot run, each in a job that
# supplies what the test needs. The factory-store tests are deselected by
# `addopts = "-m 'not integration'"`, and this is the workflow that runs `-m integration`
# (docs/decisions/2026-07-06-factory-store-integration-gate.md).
#
# LOCALLY OWNED and deliberately a separate file: quality.yml is the vendored gate, and
# keeping these jobs out of it means no `code-standards` sync or template change can touch
# them. They are NOT required status checks; making them required is a branch-protection
# decision.

name: Extended tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  integration:
    name: Factory-store integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FACTORY_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - run: uv sync --frozen

      - name: make check-integration
        run: make check-integration
