# Allowlist of known-safe scanner findings — THIS repo only.
# A security scanner's own test fixtures and design docs necessarily embed example
# tokens that match the real BWS pattern. Each entry exempts ONE exact finding
# (rule + file + the redacted match string). A real token in any other file, or a
# different token string in these files, still BLOCKs: the length in `evidence`
# changes, so the allowlist fails closed and forces a conscious re-review.

[[allow]]
rule = "bws.no-token-in-tracked-files"
file = "docs/superpowers/plans/2026-06-12-security-standards-bws-scanner.md"
evidence = "0.45eb08…(len 63)"
reason = "Example token in the implementation plan doc."

